# Ingress controller for the local kind cluster.
# On EKS, use service.type=LoadBalancer instead of NodePort.
deployment:
  replicas: 1
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
