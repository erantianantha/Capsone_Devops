name: pantrypal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pantrypal}
      POSTGRES_USER: ${POSTGRES_USER:-pantrypal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantrypal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: pantrypal-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pantrypal}:${POSTGRES_PASSWORD:-pantrypal}@postgres:5432/${POSTGRES_DB:-pantrypal}
      APP_VERSION: compose
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: pantrypal-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  pgdata:
