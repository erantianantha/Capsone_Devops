name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: "0.76.0"

jobs:
  # ---------------------------------------------------------------- tests
  backend-test:
    name: Backend lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (fails the build on any failure)
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------- build -> scan -> push
  image:
    name: Image ${{ matrix.component }} (build, Trivy scan, push)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Compute image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/pantrypal-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Trivy runs from its official, version-pinned container image.
      # --exit-code 1 makes the job (and the pipeline) fail on any fixable HIGH/CRITICAL CVE.
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              --output /out/trivy-${{ matrix.component }}.txt \
              "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            || { status=$?; cat trivy-${{ matrix.component }}.txt; exit $status; }
          cat trivy-${{ matrix.component }}.txt

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "### Trivy scan: ${{ matrix.component }}"
            echo '```'
            cat trivy-${{ matrix.component }}.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.txt

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with commit SHA)
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

  # ------------------------------------------------------------- deploy
  # Deploys to the Kubernetes cluster via a self-hosted runner that has
  # kubectl/helm access (the local kind cluster). Enable by setting the
  # repository variable DEPLOY_ENABLED=true and registering a runner.
  deploy:
    name: Deploy to Kubernetes (Helm)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted]
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Helm upgrade with the new SHA tag
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          helm upgrade --install pantrypal ./helm/pantrypal \
            --namespace pantrypal \
            --set "backend.image.repository=${REGISTRY}/${owner}/pantrypal-backend" \
            --set "frontend.image.repository=${REGISTRY}/${owner}/pantrypal-frontend" \
            --set "backend.image.tag=${GITHUB_SHA}" \
            --set "frontend.image.tag=${GITHUB_SHA}" \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl -n pantrypal rollout status deploy/pantrypal-backend
          kubectl -n pantrypal rollout status deploy/pantrypal-frontend
          kubectl -n pantrypal get pods -o wide
