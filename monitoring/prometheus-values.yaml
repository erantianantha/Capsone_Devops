# prometheus-community/prometheus chart — lightweight single-server setup.
# helm upgrade --install prometheus prometheus-community/prometheus -n monitoring -f monitoring/prometheus-values.yaml

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  retention: 3d
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.localtest.me

serverFiles:
  prometheus.yml:
    # Merged with the chart's default jobs (prometheus self-scrape, kubernetes-pods, ...).
    scrape_configs:
      # PantryPal FastAPI backend: running backend pods in the pantrypal namespace,
      # selected by their Kubernetes labels and scraped on :8000/metrics.
      - job_name: pantrypal-backend
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [pantrypal]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
