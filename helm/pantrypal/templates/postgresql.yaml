{{- if .Values.postgresql.enabled }}
{{- $sel := dict "ctx" $ "component" "postgresql" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pantrypal.fullname" . }}-postgresql
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pantrypal.fullname" . }}-postgresql
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
spec:
  serviceName: {{ include "pantrypal.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "pantrypal.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantrypal.labels" . | nindent 8 }}
        {{- include "pantrypal.selectorLabels" $sel | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pantrypal.dbSecretName" . }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
