{{- $sel := dict "ctx" $ "component" "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pantrypal.fullname" . }}-backend
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pantrypal.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantrypal.labels" . | nindent 8 }}
        {{- include "pantrypal.selectorLabels" $sel | nindent 8 }}
      annotations:
        {{- if .Values.backend.metrics.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.port | quote }}
        prometheus.io/path: {{ .Values.backend.metrics.path | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "pantrypal.image" (dict "image" .Values.backend.image "component" "backend") }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pantrypal.dbSecretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgresql.username }}:$(DB_PASSWORD)@{{ include "pantrypal.dbHost" . }}:{{ .Values.externalDatabase.port }}/{{ .Values.postgresql.database }}"
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
            - name: RUN_MIGRATIONS
              value: {{ .Values.backend.runMigrations | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pantrypal.fullname" . }}-backend
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
