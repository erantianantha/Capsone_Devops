{{- $sel := dict "ctx" $ "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pantrypal.fullname" . }}-frontend
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pantrypal.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantrypal.labels" . | nindent 8 }}
        {{- include "pantrypal.selectorLabels" $sel | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "pantrypal.image" (dict "image" .Values.frontend.image "component" "frontend") }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # Only used if the browser hits nginx's /api proxy; the Ingress normally routes /api directly
            - name: BACKEND_URL
              value: "http://{{ include "pantrypal.fullname" . }}-backend:8000"
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pantrypal.fullname" . }}-frontend
  labels:
    {{- include "pantrypal.labels" . | nindent 4 }}
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "pantrypal.selectorLabels" $sel | nindent 4 }}
