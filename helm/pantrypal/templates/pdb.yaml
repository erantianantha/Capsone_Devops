{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pantrypal.fullname" $ }}-{{ $component }}
  labels:
    {{- include "pantrypal.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "pantrypal.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
