# Default values for the PantryPal chart.
# Image tags are set to the Git commit SHA by the CI/CD pipeline:
#   helm upgrade --install pantrypal ./helm/pantrypal --set backend.image.tag=<sha> --set frontend.image.tag=<sha>

imagePullSecrets: []   # e.g. [{name: ghcr-pull}] if the GHCR packages are private

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/erantianantha/pantrypal-backend
    tag: ""            # required; set to the commit SHA
    pullPolicy: IfNotPresent
  port: 8000
  # Migrations run on start-up; a Postgres advisory lock serialises replicas
  runMigrations: true
  corsOrigins: "*"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  metrics:
    # Adds prometheus.io/* pod annotations for annotation-based scrape jobs.
    # Off by default: monitoring/prometheus-values.yaml has a dedicated
    # "pantrypal-backend" job that selects pods by label (avoids double scraping).
    scrape: false
    path: /metrics

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/erantianantha/pantrypal-frontend
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

postgresql:
  # Set enabled=false and fill externalDatabase to use RDS or another managed DB
  enabled: true
  image: postgres:16-alpine
  database: pantrypal
  username: pantrypal
  # Leave empty to auto-generate a random password (kept stable across upgrades)
  password: ""
  existingSecret: ""   # name of a Secret with key "postgres-password"
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

externalDatabase:
  host: ""
  port: 5432

ingress:
  enabled: true
  className: traefik
  host: pantrypal.localtest.me
  annotations: {}
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# HorizontalPodAutoscaler for the backend (needs metrics-server in the cluster)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
